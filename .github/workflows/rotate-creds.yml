name: Hourly Security Credential Rotation

on:
  schedule:
    - cron: '0 * * * *' # Run every hour at minute 0
  workflow_dispatch: # Allow manual trigger from GitHub Actions

jobs:
  rotate:
    name: Rotate Credentials & Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Credential Rotation
        run: node scripts/rotate-creds.cjs
